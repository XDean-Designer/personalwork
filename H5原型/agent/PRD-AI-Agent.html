<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Agent · UI/UX PRD</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #666;
      --line: #e8e8e8;
      --bg: #f7f7f8;
      --card: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.65;
    }
    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 20px 64px;
    }
    header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    #md {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px 20px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.92rem;
      overflow-x: auto;
    }
    .err { color: #c0392b; padding: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>AI Agent · UI/UX 设计规格 PRD</h1>
      <p>来源：docs/agent-chat-ui-ux-prd.md · 供展台内阅读</p>
    </header>
    <pre id="md">加载中…</pre>
  </div>
  <script>
    fetch("docs/agent-chat-ui-ux-prd.md")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (t) {
        document.getElementById("md").textContent = t;
      })
      .catch(function (e) {
        document.getElementById("md").className = "err";
        document.getElementById("md").textContent = "PRD 加载失败：" + e.message;
      });
  </script>
</body>
</html>
