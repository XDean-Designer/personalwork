<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面不存在 | 薛鼎</title>
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    .err-wrap { min-height: 70vh; display: grid; place-content: center; text-align: center; gap: 10px; }
    .err-code { font-size: 4.5rem; font-weight: 700; letter-spacing: -0.04em; color: #f5f5f7; line-height: 1; }
    .err-wrap p { color: rgba(235, 235, 245, 0.6); margin: 0; }
    .err-wrap .btn { margin-top: 18px; justify-self: center; }
  </style>
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>
  <div class="page">
    <div class="container err-wrap">
      <span class="section-label">404</span>
      <div class="err-code">页面走丢了</div>
      <p>链接可能已更新，或作品页换了路径。</p>
      <a class="btn btn-primary pressable" href="/index.html">返回首页</a>
    </div>
  </div>
</body>
</html>
